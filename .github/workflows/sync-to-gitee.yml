name: Sync to Gitee

# 触发条件：
#   1. 每次往 GitHub 的 main 分支推送代码时，自动同步到 Gitee
#   2. 也可以在 GitHub 网页 Actions 页面手动点 "Run workflow" 触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 目标 Gitee 仓库
# 注意：三处命名各不相同，别混
#   GitHub 用户名 = tenlon-m（连字符）   仓库名 = AFM-EST
#   Gitee  用户名 = tenlonm （连着写）   仓库名 = afm-est
env:
  GITEE_USER: tenlonm
  GITEE_REPO: afm-est
  GITEE_HOST: gitee.com

jobs:
  sync-to-gitee:
    name: Mirror main branch to Gitee
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取完整仓库（fetch-depth: 0 = 全量历史，镜像才完整）
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. 检查令牌是否配置（对应仓库 Settings -> Secrets -> GITEE_TOKEN）
      - name: Check token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error title=缺少 Secret::仓库未配置 GITEE_TOKEN。请到 Settings -> Secrets and variables -> Actions 添加，值为 Gitee 私人令牌（https://gitee.com/profile/personal_access_tokens 生成，需勾选 projects 权限）。"
            exit 1
          fi
          echo "::notice title=Token OK::GITEE_TOKEN 已配置"

      # 3. 写入 git 凭据（token 只存在凭据文件里，不会出现在 remote URL 和日志中）
      - name: Setup credentials
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://%s:%s@%s\n' "$GITEE_USER" "$GITEE_TOKEN" "$GITEE_HOST" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          echo "凭据已写入"

      # 4. 自诊断：确认仓库存在且令牌有读写权限，失败时给出明确原因
      - name: Diagnose Gitee access
        run: |
          url="https://$GITEE_HOST/$GITEE_USER/$GITEE_REPO.git"
          set +e
          out=$(git ls-remote "$url" 2>&1)
          code=$?
          set -e
          echo "----- git ls-remote 输出 -----"
          echo "$out" | tail -5
          echo "----- exit code: $code -----"

          if [ $code -eq 0 ]; then
            echo "::notice title=仓库可访问::$url 已可读写"
          elif echo "$out" | grep -qiE "not found|404|does not exist"; then
            echo "::error title=仓库不存在::无法访问 $url（404）。请确认：① Gitee 上已创建仓库 $GITEE_REPO；② 用户名 $GITEE_USER 拼写正确。"
            exit 1
          elif echo "$out" | grep -qiE "authentication failed|unauthorized|403|invalid"; then
            echo "::error title=令牌无效或权限不足::GITEE_TOKEN 被 Gitee 拒绝（403/Unauthorized）。请确认：① 令牌勾选了 projects 权限且未过期；② 若仓库为私有，确保令牌所属账号有权访问。"
            exit 1
          else
            echo "::error title=访问失败::无法访问 $url，原因见上方输出。"
            exit 1
          fi

      # 5. 把代码推送到 Gitee 的镜像仓库
      - name: Push to Gitee
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://$GITEE_HOST/$GITEE_USER/$GITEE_REPO.git"
          git push gitee "main:main" --force
          git push gitee --tags --force
          echo "::notice title=同步成功::已同步到 https://gitee.com/$GITEE_USER/$GITEE_REPO"
