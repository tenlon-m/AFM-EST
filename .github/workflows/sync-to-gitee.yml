name: Sync to Gitee

# 触发条件：
#   1. 每次往 GitHub 的 main 分支推送代码时，自动同步到 Gitee
#   2. 也可以在 GitHub 网页 Actions 页面手动点 "Run workflow" 触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 目标 Gitee 仓库（注意：GitHub 用户名 tenlon-m 用连字符，Gitee 用户名 tenlon_m 用下划线）
env:
  GITEE_REPO: git@gitee.com:tenlon_m/AFM-EST.git

jobs:
  sync-to-gitee:
    name: Mirror main branch to Gitee
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取完整仓库（fetch-depth: 0 = 全量历史，镜像才完整）
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2. 配置 SSH 私钥，用于登录 Gitee
      #    私钥从仓库 Settings -> Secrets and variables -> Actions 里读取
      - name: Setup SSH key
        env:
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$GITEE_PRIVATE_KEY" ]; then
            echo "::error title=缺少 Secret::仓库里没有配置 GITEE_PRIVATE_KEY。请到 Settings -> Secrets and variables -> Actions 添加。"
            exit 1
          fi

          printf '%s\n' "$GITEE_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts 2>/dev/null

          # 打印私钥指纹，方便和 Gitee 上的公钥指纹核对
          ssh-keygen -lf ~/.ssh/id_ed25519.pub 2>/dev/null || echo "（.pub 未随私钥一起提供，跳过指纹）"
          echo "SSH key 配置完成"

      # 3. 自诊断：先验证 SSH 能否通过 Gitee 认证，失败时给出明确原因
      - name: Diagnose SSH auth
        run: |
          set +e
          out=$(ssh -T -o BatchMode=yes -o ConnectTimeout=15 git@gitee.com 2>&1)
          code=$?
          echo "----- ssh -T git@gitee.com 输出 -----"
          echo "$out"
          echo "----- exit code: $code -----"

          if echo "$out" | grep -qi "only supports pull/fetch"; then
            echo "::error title=部署公钥缺少推送权限::SSH 认证通过，但 Gitee 返回『DeployKey only supports pull/fetch operations』。请到 Gitee 仓库 -> 管理 -> 部署公钥管理，编辑这把公钥并勾选「启用推送权限」，保存后重试。"
            exit 1
          fi

          if echo "$out" | grep -qi "successfully authenticated"; then
            echo "::notice title=SSH OK::Gitee SSH 认证通过（且具备推送权限）"
          else
            echo "::error title=SSH 认证失败::Gitee 认不出这把私钥。请逐项检查：① Gitee 仓库管理 -> 部署公钥管理 里是否添加了公钥；② 添加时是否勾选了「启用推送权限」；③ GitHub 里的 GITEE_PRIVATE_KEY 是否是与该公钥配对的私钥（两者必须成对）。"
            exit 1
          fi

      # 4. 自诊断：确认目标仓库存在且可访问
      - name: Diagnose Gitee repo access
        run: |
          if git ls-remote "$GITEE_REPO" >/dev/null 2>&1; then
            echo "::notice title=仓库可访问::$GITEE_REPO 存在且可读"
          else
            echo "::error title=仓库不可访问::无法访问 $GITEE_REPO。请确认：① Gitee 上是否已创建仓库 AFM-EST；② 用户名是否为 tenlon_m（下划线，不是 tenlon-m）；③ 仓库是否为空仓（未勾选 Readme 初始化）。"
            exit 1
          fi

      # 5. 把代码推送到 Gitee 的镜像仓库
      - name: Push to Gitee
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitee "$GITEE_REPO"
          git push gitee main --force
          git push gitee --tags --force
          echo "::notice title=同步成功::已同步到 https://gitee.com/tenlon_m/AFM-EST"
